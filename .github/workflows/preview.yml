name: Preview

# Cada PR hacia develop se publica en un canal de vista previa de unbarber-desa
# (URL temporal, vence a los 7 días). No toca el sitio publicado ni la base.
on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: desa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Config web de desa
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@15 apps:sdkconfig WEB --project desa --json | APP_ENV=desa node scripts/write-env.mjs
          rm -f "$RUNNER_TEMP/sa.json"
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: unbarber-desa
          target: app
          expires: 7d
